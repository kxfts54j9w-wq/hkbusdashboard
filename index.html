<!DOCTYPE html>
<html lang="zh-HK" class="h-full w-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>香港公共交通與天文台天氣 Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kmb: '#e11d48',
            ctb: '#eab308',
            mtr: '#00508f',
            mtrbus: '#a21caf',
            lrt: '#0f766e',
            bgDark: '#0b0e14',
            cardDark: '#131822'
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="text-white min-h-screen md:h-screen w-full flex flex-col justify-between p-2 sm:p-4 box-border overflow-y-auto md:overflow-hidden relative bg-[#0b0e14]">

  <!-- Header bar -->
  <header class="flex justify-between items-center px-2 py-1 mb-1 text-xs text-slate-400 shrink-0">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse-fast"></span>
      <span id="liveStatusText" class="font-mono tracking-tight text-[11px] sm:text-xs text-slate-400">即時更新 (每15秒)</span>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 min-h-0 w-full mb-1">
    
    <!-- Left Section: Weather & Clock & Holiday Countdown -->
    <section class="md:col-span-5 lg:col-span-4 bg-cardDark rounded-2xl p-4 flex flex-col justify-between border border-slate-800 shadow-2xl overflow-y-auto custom-scrollbar gap-4">
      
      <!-- Top Section: Weather & Clock Layout -->
      <div class="flex flex-col gap-2">
        <!-- Min/Max Temp & Refresh Header -->
        <div class="flex justify-between items-center text-slate-300 font-medium">
          <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold">
            <span><i class="fa-solid fa-arrow-down text-blue-400"></i> <span id="minTemp">26</span>°C</span>
            <span><i class="fa-solid fa-arrow-up text-rose-400"></i> <span id="maxTemp">29</span>°C</span>
          </div>
          <button onclick="fetchWeatherData()" title="重新整理天氣" class="text-slate-400 hover:text-white p-1 transition">
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </button>
        </div>

        <!-- Main Weather + Clock Grid -->
        <div class="flex justify-between items-start mt-1">
          <!-- Left: Big Temperature & Humidity & Station Info -->
          <div class="flex flex-col">
            <div id="currentTemp" class="text-5xl sm:text-6xl font-black tracking-tight font-mono text-white leading-none">
              28°C
            </div>
            <div id="humidity" class="text-2xl sm:text-3xl font-bold text-slate-200 font-mono mt-1">
              82%
            </div>
            
            <div class="mt-3 space-y-0.5">
              <div class="flex items-center gap-2">
                <h2 id="stationName" class="text-2xl sm:text-3xl font-black tracking-wide text-white">京士柏</h2>
                <span id="warningBadge" class="hidden text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium">天氣警告</span>
              </div>
              <p id="uvIndex" class="text-xs sm:text-sm text-slate-300 font-medium mt-1">紫外線指數: 0 (低)</p>
            </div>
          </div>

          <!-- Right: Weather Icon & Digital Clock & Pill Date -->
          <div class="flex flex-col items-end justify-between self-stretch">
            <img id="weatherIcon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic50.png" alt="Weather Icon" class="w-16 h-16 sm:w-20 sm:h-20 object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://placehold.co/80x80/000000/FFF?text=HKO';">
            
            <div class="text-right mt-2">
              <div id="clockDisplay" class="text-2xl sm:text-3xl font-extrabold font-mono tracking-wider text-white">
                22:28:53
              </div>
              <div id="dateDisplay" class="mt-1 inline-block bg-teal-950/80 border border-teal-700/60 text-teal-300 px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide">
                2026年8月21日(五)
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Holiday Countdown Card -->
      <div class="w-full my-auto">
        <div class="relative overflow-hidden bg-gradient-to-br from-amber-950/70 via-stone-900 to-amber-950/90 border-2 border-amber-600/70 rounded-2xl p-4 shadow-xl">
          <div class="flex justify-between items-center mb-1.5">
            <div class="flex items-center gap-2 text-amber-400 font-bold text-xs uppercase tracking-wider">
              <i class="fa-solid fa-plane text-amber-400"></i>
              <span id="countdownBadgeMode">香港公眾假期 (自動)</span>
            </div>
            <span class="text-[10px] bg-amber-600/40 text-amber-200 px-2 py-0.5 rounded-full border border-amber-500/50 font-semibold" id="countdownTypeLabel">自動追蹤</span>
          </div>

          <div class="flex justify-between items-end gap-2 mt-2">
            <div class="min-w-0 flex-1">
              <h3 id="countdownTitle" class="text-2xl sm:text-3xl font-black text-white tracking-tight truncate leading-tight">
                中秋節翌日
              </h3>
              <p id="countdownDateSub" class="text-xs sm:text-sm text-amber-200/90 font-medium mt-1">
                2026年09月26日 (星期六)
              </p>
              <div class="text-[11px] text-slate-400 mt-3 font-medium">
                距離放假還有
              </div>
            </div>

            <div class="text-right shrink-0">
              <div class="flex items-baseline justify-end gap-1">
                <span id="countdownDays" class="text-5xl sm:text-6xl font-black font-mono text-amber-400 tracking-tight leading-none drop-shadow">
                  36
                </span>
                <span class="text-base sm:text-lg font-bold text-amber-300">天</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <!-- Right Section: Transport Arrival Times List -->
    <section class="md:col-span-7 lg:col-span-8 flex flex-col bg-cardDark rounded-2xl border border-slate-800 overflow-hidden shadow-2xl min-h-[350px] md:min-h-0">
      <div class="bg-red-800 px-4 py-2.5 flex justify-between items-center shrink-0 shadow">
        <div class="flex items-center gap-2">
          <h1 class="text-base sm:text-lg font-black text-white tracking-wide flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left"></i> 即時到站時間
          </h1>
          <span id="routeCountBadge" class="bg-black/30 text-white text-[11px] px-2.5 py-0.5 rounded-full font-medium">0 條路線</span>
          <button onclick="manualRefreshEta()" title="手動更新到站時間" class="bg-black/20 hover:bg-black/40 active:scale-95 text-white px-2 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 transition ml-1">
            <i id="transitRefreshIcon" class="fa-solid fa-rotate-right text-xs"></i>
            <span class="hidden sm:inline">更新</span>
          </button>
        </div>
        <div class="text-xs text-red-100/90 font-mono font-medium">
          分鐘 min(s)
        </div>
      </div>

      <div id="transitCardList" class="flex-1 p-3 space-y-2.5 overflow-y-auto custom-scrollbar">
        <!-- Live Route Cards Rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Floating Settings Button (Bottom Right) -->
  <button onclick="openModal('customModal')" class="fixed bottom-4 right-4 z-40 bg-slate-800/90 hover:bg-slate-700 text-slate-100 px-4 py-2.5 rounded-full text-xs sm:text-sm font-bold transition border border-slate-600 shadow-2xl flex items-center gap-2 active:scale-95 backdrop-blur-md hover:border-amber-400">
    <i class="fa-solid fa-sliders text-amber-400 text-sm"></i>
    <span>設定及路線</span>
  </button>

  <!-- Configuration Modal -->
  <div id="customModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-2.5 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-amber-400"></i> 自訂 Dashboard 設定
        </h3>
        <button onclick="closeModal('customModal')" class="text-slate-400 hover:text-white p-1 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3.5 sm:p-4 overflow-y-auto space-y-4 custom-scrollbar text-xs sm:text-sm">
        
        <!-- Weather Station & Holiday Config -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700">
            <h4 class="font-bold text-slate-200 mb-1.5 flex items-center gap-1.5 text-xs">
              <i class="fa-solid fa-cloud-sun text-amber-400"></i> 天文台氣象站
            </h4>
            <select id="selectWeatherStation" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
              <option value="京士柏">京士柏 (King's Park)</option>
              <option value="香港天文台">香港天文台 (Hong Kong Observatory)</option>
              <option value="屯門">屯門 (Tuen Mun)</option>
              <option value="沙田">沙田 (Sha Tin)</option>
              <option value="元朗公園">元朗公園 (Yuen Long)</option>
              <option value="旺角">旺角 (Mong Kok)</option>
              <option value="觀塘">觀塘 (Kwun Tong)</option>
              <option value="將軍澳">將軍澳 (Tseung Kwan O)</option>
              <option value="荃灣">荃灣 (Tsuen Wan)</option>
              <option value="赤鱲角">赤鱲角 (Chek Lap Kok)</option>
            </select>
          </div>

          <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700">
            <h4 class="font-bold text-slate-200 mb-1.5 flex items-center gap-1.5 text-xs">
              <i class="fa-solid fa-calendar-star text-amber-400"></i> 倒數模式設定
            </h4>
            <select id="selectCountdownMode" onchange="onCountdownModeChange()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500 mb-2">
              <option value="AUTO_HK_HOLIDAY">🎉 自動追蹤下一個香港公眾假期</option>
              <option value="SELECT_HOLIDAY">📅 指定特定香港公眾假期</option>
              <option value="CUSTOM">✍️ 自訂倒數名稱及日期</option>
            </select>

            <div id="holidaySelectWrap" class="hidden mb-1.5">
              <select id="selectSpecificHoliday" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white">
              </select>
            </div>

            <div id="customCountdownInputs" class="space-y-1.5 hidden">
              <input type="text" id="inputCountdownTitle" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white" placeholder="例如：自訂紀念日 / 考試">
              <input type="date" id="inputCountdownDate" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white">
            </div>
          </div>
        </div>

        <!-- Add New Transit Route Search Container -->
        <div class="bg-slate-800/80 p-3 rounded-xl border border-amber-500/30 space-y-2.5">
          <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
            <h4 class="font-bold text-amber-400 flex items-center gap-1.5 text-xs sm:text-sm">
              <i class="fa-solid fa-magnifying-glass"></i> 搜尋及新增公共交通路線
            </h4>
          </div>

          <!-- Transport Operator Tabs (5 Options) -->
          <div class="grid grid-cols-5 gap-1 bg-slate-950 p-1 rounded-lg text-center text-xs">
            <button id="tab-KMB" onclick="selectOperator('KMB')" class="py-1 rounded font-bold transition bg-rose-600 text-white text-[10px] sm:text-xs">九巴/龍運</button>
            <button id="tab-CTB" onclick="selectOperator('CTB')" class="py-1 rounded font-bold transition text-slate-400 hover:text-white text-[10px] sm:text-xs">城巴 CTB</button>
            <button id="tab-MTRBUS" onclick="selectOperator('MTRBUS')" class="py-1 rounded font-bold transition text-slate-400 hover:text-white text-[10px] sm:text-xs">港鐵巴士</button>
            <button id="tab-MTR" onclick="selectOperator('MTR')" class="py-1 rounded font-bold transition text-slate-400 hover:text-white text-[10px] sm:text-xs">港鐵重鐵</button>
            <button id="tab-LRT" onclick="selectOperator('LRT')" class="py-1 rounded font-bold transition text-slate-400 hover:text-white text-[10px] sm:text-xs">香港輕鐵</button>
          </div>

          <!-- Bus Search Section (KMB / CTB) -->
          <div id="searchContainerBus" class="space-y-2">
            <div class="flex gap-2">
              <input type="text" id="routeSearchInput" onkeyup="filterBusRoutes()" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400" placeholder="輸入路線號碼 (例如: 1A, 102, 68X, 968...)">
              <button onclick="filterBusRoutes()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs text-white font-bold">
                搜尋
              </button>
            </div>

            <div>
              <label class="text-[11px] text-slate-400 block mb-1">選擇路線及方向：</label>
              <select id="routeSelectDropdown" onchange="onRouteSelected()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <option value="">-- 請先輸入路線號碼搜尋 --</option>
              </select>
            </div>

            <div>
              <label class="text-[11px] text-slate-400 block mb-1">選擇上車站點：</label>
              <select id="stopSelectDropdown" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <option value="">-- 請先選擇路線 --</option>
              </select>
            </div>
          </div>

          <!-- MTR Bus Search Section -->
          <div id="searchContainerMTRBus" class="space-y-2 hidden">
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">選擇港鐵巴士路線及方向：</label>
              <select id="mtrBusRouteSelect" onchange="onMtrBusRouteSelected()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
              </select>
            </div>

            <div>
              <label class="text-[11px] text-slate-400 block mb-1">選擇上車站點：</label>
              <select id="mtrBusStopSelect" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <option value="">載入分站中...</option>
              </select>
            </div>
          </div>

          <!-- MTR Heavy Rail Search Section -->
          <div id="searchContainerMTR" class="space-y-2 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">選擇綫路：</label>
                <select id="mtrLineSelect" onchange="onMtrLineChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                </select>
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">選擇車站：</label>
                <select id="mtrStationSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                </select>
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">往方向/終點：</label>
                <select id="mtrBoundSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                  <option value="DOWN">DOWN（API 下行方向）</option>
                  <option value="UP">UP（API 上行方向）</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Light Rail Search Section -->
          <div id="searchContainerLRT" class="space-y-2 hidden">
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">1. 選擇輕鐵路線：</label>
              <select id="lrtRouteSelect" onchange="onLrtRouteSelected()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">2. 選擇上車站點：</label>
                <select id="lrtOriginSelect" onchange="onLrtOriginChanged()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                  <option value="">-- 請先選擇輕鐵路線 --</option>
                </select>
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">3. 選擇落車站點 (目的地)：</label>
                <select id="lrtDestSelect" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                  <option value="">-- 請先選擇上車站點 --</option>
                </select>
              </div>
            </div>
          </div>

          <button onclick="addSelectedRoute()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs transition shadow-md active:scale-98">
            + 新增選定路線至首頁 Display
          </button>
        </div>

        <!-- Saved Routes Configurator -->
        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700 space-y-2">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-slate-200 flex items-center gap-1.5 text-xs">
              <i class="fa-solid fa-list text-emerald-400"></i> 已儲存顯示路線
            </h4>
            <button onclick="addDefaultPresets()" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200">
              重置為預設路線
            </button>
          </div>

          <div id="modalRouteList" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-1">
          </div>
        </div>

      </div>

      <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end gap-2">
        <button onclick="closeModal('customModal')" class="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded text-slate-200 text-xs font-semibold">
          取消
        </button>
        <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded text-white text-xs font-semibold">
          儲存並更新 Dashboard
        </button>
      </div>

    </div>
  </div>

  <script>
    const HK_PUBLIC_HOLIDAYS = [
      { name: "元旦", date: "2025-01-01" },
      { name: "農曆年初一", date: "2025-01-29" },
      { name: "農曆年初二", date: "2025-01-30" },
      { name: "農曆年初三", date: "2025-01-31" },
      { name: "清明節", date: "2025-04-04" },
      { name: "耶穌受難節", date: "2025-04-18" },
      { name: "耶穌受難節翌日", date: "2025-04-19" },
      { name: "復活節星期一", date: "2025-04-21" },
      { name: "勞動節", date: "2025-05-01" },
      { name: "佛誕", date: "2025-05-05" },
      { name: "端午節", date: "2025-05-31" },
      { name: "香港特別行政區成立紀念日", date: "2025-07-01" },
      { name: "國慶日", date: "2025-10-01" },
      { name: "中秋節翌日", date: "2025-10-07" },
      { name: "重陽節", date: "2025-10-29" },
      { name: "聖誕節", date: "2025-12-25" },
      { name: "聖誕節後第一個周日", date: "2025-12-26" },

      { name: "元旦", date: "2026-01-01" },
      { name: "農曆年初一", date: "2026-02-17" },
      { name: "農曆年初二", date: "2026-02-18" },
      { name: "農曆年初三", date: "2026-02-19" },
      { name: "耶穌受難節", date: "2026-04-03" },
      { name: "耶穌受難節翌日", date: "2026-04-04" },
      { name: "清明節翌日", date: "2026-04-06" },
      { name: "復活節星期一", date: "2026-04-06" },
      { name: "勞動節", date: "2026-05-01" },

    function isValidMtrBusStationName(name, stopId) {
      if (name === null || name === undefined) return false;
      const value = String(name).trim();
      if (!value || value === String(stopId).trim()) return false;
      if (/^(分站|站點|stop)\s*[0-9一二三四五六七八九十]+$/i.test(value)) return false;
      return true;
    }

    function normalizeMtrBusStopId(stopId) {
      let id = String(stopId || '').trim().toUpperCase().replace(/\s+/g, '');
      id = id.replace(/-N([DU])([0-9]+)/, '-$1$2');
      return id;
    }

    function setMtrBusStationName(stopId, name) {
      if (!stopId || !isValidMtrBusStationName(name, stopId)) return;
      const raw = String(stopId).trim();
      const normalized = normalizeMtrBusStopId(raw);
      const displayName = String(name).trim();
      MTR_BUS_STATION_MAP[raw] = displayName;
      MTR_BUS_STATION_MAP[normalized] = displayName;

      const apiAlias = normalized.replace(/-([DU])([0-9]+)$/, '-n$1$2');
      MTR_BUS_STATION_MAP[apiAlias] = displayName;
    }

    let mtrBusStationMasterLoaded = false;
    let mtrBusStationMasterPromise = null;

    function getMtrBusStationName(stopId, routeName, fallbackName, seq) {
      const rawId = String(stopId || '').trim();
      if (!rawId) return isValidMtrBusStationName(fallbackName, rawId) ? String(fallbackName).trim() : `站點 ${seq || ''}`;

      const normalizedId = normalizeMtrBusStopId(rawId);
      const upperRaw = rawId.toUpperCase();
      const apiAliasUpper = normalizedId.replace(/-([DU])([0-9]+)$/, '-N$1$2');
      const apiAliasLower = normalizedId.replace(/-([DU])([0-9]+)$/, '-n$1$2');

      const mapped = MTR_BUS_STATION_MAP[rawId] ||
                     MTR_BUS_STATION_MAP[upperRaw] ||
                     MTR_BUS_STATION_MAP[normalizedId] ||
                     MTR_BUS_STATION_MAP[apiAliasUpper] ||
                     MTR_BUS_STATION_MAP[apiAliasLower];

      if (isValidMtrBusStationName(mapped, rawId)) return mapped;

      if (isValidMtrBusStationName(fallbackName, rawId)) {
        return String(fallbackName).trim();
      }

      // Pattern matcher fallback for ROUTE-[nD]*[DU]NUM
      const match = normalizedId.match(/^([A-Z0-9]+)-[N]?(D|U)([0-9]+)$/);
      if (match) {
        const route = match[1];
        const dir = match[2];
        const numVal = parseInt(match[3], 10);
        const paddedNum = String(numVal).padStart(3, '0');
        const candidateKey = `${route}-${dir}${paddedNum}`;

        if (MTR_BUS_STATION_MAP[candidateKey]) {
          return MTR_BUS_STATION_MAP[candidateKey];
        }
      }

      return rawId ? `站點 (${rawId})` : `站點 ${seq || ''}`;
    }

    function parseSimpleCsv(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
          else { quoted = !quoted; }
        } else if (ch === ',' && !quoted) {
          row.push(cell); cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); cell = '';
          if (row.some(v => String(v).trim() !== '')) rows.push(row);
          row = [];
        } else {
          cell += ch;
        }
      }
      if (cell.length || row.length) {
        row.push(cell);
        if (row.some(v => String(v).trim() !== '')) rows.push(row);
      }
      return rows;
    }

    async function loadAllMtrBusStationsMaster() {
      if (mtrBusStationMasterLoaded) return;
      if (mtrBusStationMasterPromise) return mtrBusStationMasterPromise;

      mtrBusStationMasterPromise = (async () => {
      try {
        const csvRes = await fetch('https://opendata.mtr.com.hk/data/mtr_bus_stops.csv', { cache: 'no-store' });
        if (csvRes.ok) {
          const csvText = await csvRes.text();
          const rows = parseSimpleCsv(csvText).map(row => row.map(v => String(v).trim()));
          if (rows.length > 1) {
            const headers = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9一-龥]+/g, ''));
            const findHeader = (patterns) => headers.findIndex(h => patterns.some(p => h.includes(p)));
            const idIdx = findHeader(['busstopid', 'stopid', 'busstopcode', 'stopcode', '車站編號', '車站代號', '站點編號']);
            const tcIdx = findHeader(['busstopnamechi', 'busstopnamech', 'chinesename', 'namechi', '名稱中文', '中文名稱', '車站名稱']);
            const enIdx = findHeader(['busstopnameen', 'englishname', 'nameen', '英文名稱']);

            if (idIdx >= 0) {
              rows.slice(1).forEach(row => {
                const id = row[idIdx];
                const tcName = tcIdx >= 0 ? row[tcIdx] : '';
                const enName = enIdx >= 0 ? row[enIdx] : '';
                if (id && isValidMtrBusStationName(tcName, id)) setMtrBusStationName(id, tcName);
                else if (id && isValidMtrBusStationName(enName, id)) setMtrBusStationName(id, enName);
              });
            }
          }
        }
      } catch (err) {
        console.warn('載入港鐵巴士官方 CSV 站名庫失敗，繼續使用其他來源', err);
      }

      try {
        const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getBusStop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: 'zh' })
        });
        if (res.ok) {
          const data = await res.json();
          const list = Array.isArray(data) ? data : (data.busStop || data.busStopList || data.data || []);
          list.forEach(st => {
            const id = st.busStopId || st.busStopCode || st.stopId || st.stop_code;
            const name = st.busStopNameChi || st.busStopChineseName || st.busStopName || st.nameChi || st.name || st.stop_name_tc;
            if (id && isValidMtrBusStationName(name, id)) setMtrBusStationName(id, name);
          });
        }
      } catch (err) {
        console.warn('動態載入港鐵巴士官方站名 API 失敗，將使用已載入站名庫', err);
      }
      mtrBusStationMasterLoaded = true;
      })();
      try {
        await mtrBusStationMasterPromise;
      } finally {
        mtrBusStationMasterPromise = null;
      }
    }

    function getLrtRouteInfo(routeNo) {
      return LRT_ROUTES.find(r => r.route === String(routeNo));
    }

    function getLrtDirectionSequences(routeInfo) {
      if (!routeInfo) return [];
      if (routeInfo.directions) {
        return Object.keys(routeInfo.directions).sort((a, b) => Number(a) - Number(b)).map(k => routeInfo.directions[k]);
      }
      return [routeInfo.stations || []];
    }

    function getLrtRouteStationUnion(routeInfo) {
      if (!routeInfo) return [];
      const map = new Map();
      getLrtDirectionSequences(routeInfo).forEach(seq => {
        seq.forEach(st => {
          if (!map.has(st.id)) map.set(st.id, st.name);
        });
      });
      return Array.from(map, ([id, name]) => ({ id, name }));
    }

    function getAllLrtStations() {
      const map = new Map();
      LRT_ROUTES.forEach(routeInfo => {
        getLrtRouteStationUnion(routeInfo).forEach(st => {
          if (!map.has(st.id)) map.set(st.id, st.name);
        });
      });
      return Array.from(map, ([id, name]) => ({ id, name }))
        .sort((a, b) => a.name.localeCompare(b.name, 'zh-HK'));
    }

    function getReachableLrtDestinations(routeInfo, originStationId) {
      if (!routeInfo) return [];
      const result = new Map();
      getLrtDirectionSequences(routeInfo).forEach(seq => {
        const originIdx = seq.findIndex(st => st.id === originStationId);
        if (originIdx === -1) return;
        for (let i = originIdx + 1; i < seq.length; i++) {
          const st = seq[i];
          if (!result.has(st.id)) result.set(st.id, st.name);
        }
      });
      return Array.from(result, ([id, name]) => ({ id, name }));
    }

    function migrateSavedLrtRoutes() {
      if (!appConfig || !Array.isArray(appConfig.routes)) return;

      const stations = getAllLrtStations();
      const byName = new Map();
      stations.forEach(st => byName.set(normalizeStationName(st.name), st));

      let changed = false;

      appConfig.routes.forEach(route => {
        if (!route || route.type !== 'LRT') return;

        const originNorm = normalizeStationName(route.origin || '');
        const originMatch = originNorm ? byName.get(originNorm) : null;
        if (originMatch && route.stationId !== originMatch.id) {
          route.stationId = originMatch.id;
          route.origin = `${originMatch.name}站`;
          changed = true;
        }

        const destRaw = route.destStationName || route.dest || '';
        const destNorm = normalizeStationName(destRaw);
        if (destNorm && destNorm !== '所有目的地') {
          const destMatch = byName.get(destNorm);
          if (destMatch) {
            if (route.destStationName !== destMatch.name) {
              route.destStationName = destMatch.name;
              changed = true;
            }
            const canonicalDest = `${destMatch.name}站`;
            if (route.dest !== canonicalDest) {
              route.dest = canonicalDest;
              changed = true;
            }
          }
        }
      });

      if (changed) {
        try {
          localStorage.setItem('hk_dashboard_config_v5', JSON.stringify(appConfig));
        } catch (e) {
          console.warn('儲存輕鐵路線資料遷移結果失敗', e);
        }
      }
    }

    function migrateSavedMtrRoutes() {
      if (!appConfig || !Array.isArray(appConfig.routes)) return;

      const aliases = {
        TML: { TSW: 'TIS' },
        TWL: { TSW: 'TSU' },
        EAL: { EXH: 'EXC' },
        TKL: { TTI: 'TIK', HAO: 'HAH' }
      };

      let changed = false;
      appConfig.routes.forEach(route => {
        if (!route || route.type !== 'MTR') return;

        const line = String(route.line || '').toUpperCase();
        const oldSta = String(route.sta || '').toUpperCase();
        const canonical = (aliases[line] || {})[oldSta];

        if (canonical && canonical !== oldSta) {
          route.sta = canonical;
          const stationName = getMtrStationName(line, canonical);
          if (stationName && route.origin) route.origin = `${stationName}站`;
          changed = true;
        }
      });

      if (changed) {
        try {
          localStorage.setItem('hk_dashboard_config_v5', JSON.stringify(appConfig));
        } catch (e) {
          console.warn('儲存港鐵重鐵路線資料遷移結果失敗', e);
        }
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockDisplay').textContent = `${hours}:${mins}:${secs}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      const weekDay = weekDays[now.getDay()];

      document.getElementById('dateDisplay').textContent = `${year}年${month}月${date}日(${weekDay})`;

      updateHolidayCountdown(now);
    }

    function updateHolidayCountdown(now) {
      const mode = appConfig.countdownMode || 'AUTO_HK_HOLIDAY';
      let title = '';
      let targetDateStr = '';
      let badgeLabel = '公眾假期';

      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      if (mode === 'AUTO_HK_HOLIDAY') {
        const upcoming = HK_PUBLIC_HOLIDAYS.filter(h => h.date >= todayStr).sort((a, b) => new Date(a.date) - new Date(b.date));
        if (upcoming.length > 0) {
          const nextHoliday = upcoming[0];
          title = nextHoliday.name;
          targetDateStr = nextHoliday.date;
          badgeLabel = '自動追蹤';
          document.getElementById('countdownBadgeMode').textContent = '香港公眾假期 (自動)';
        } else {
          title = '新年假期';
          targetDateStr = `${now.getFullYear() + 1}-01-01`;
          badgeLabel = '自動追蹤';
        }
      } else if (mode === 'SELECT_HOLIDAY') {
        title = appConfig.countdownTitle || '香港公眾假期';
        targetDateStr = appConfig.countdownDate || '2026-09-26';
        badgeLabel = '指定假期';
        document.getElementById('countdownBadgeMode').textContent = '指定假期倒數';
      } else {
        title = appConfig.countdownTitle || '自訂倒數日';
        targetDateStr = appConfig.countdownDate || todayStr;
        badgeLabel = '自訂倒數';
        document.getElementById('countdownBadgeMode').textContent = '自訂倒數提醒';
      }

      document.getElementById('countdownTypeLabel').textContent = badgeLabel;
      document.getElementById('countdownTitle').textContent = title;

      if (targetDateStr) {
        const parts = targetDateStr.split('-');
        const targetObj = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        document.getElementById('countdownDateSub').textContent = `${parts[0]}年${parts[1]}月${parts[2]}日 (星期${weekDays[targetObj.getDay()]})`;

        const diffTime = targetObj.setHours(0,0,0,0) - new Date(now).setHours(0,0,0,0);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('countdownDays').textContent = diffDays >= 0 ? diffDays : 0;
      }
    }

    async function fetchWeatherData() {
      try {
        const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await response.json();

        if (data.temperature && data.temperature.data) {
          const selectedStation = appConfig.weatherStation || '京士柏';
          const stationInfo = data.temperature.data.find(s => s.place.includes(selectedStation)) || data.temperature.data[0];
          
          document.getElementById('stationName').textContent = stationInfo.place;
          document.getElementById('currentTemp').textContent = `${stationInfo.value}°C`;

          const temps = data.temperature.data.map(d => d.value);
          document.getElementById('minTemp').textContent = Math.min(...temps);
          document.getElementById('maxTemp').textContent = Math.max(...temps);
        }

        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').textContent = `${data.humidity.data[0].value}%`;
        }

        if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
          const uv = data.uvindex.data[0];
          document.getElementById('uvIndex').innerHTML = `紫外線指數: <span class="font-semibold text-amber-300">${uv.value} (${uv.desc || '低'})</span>`;
        } else {
          document.getElementById('uvIndex').innerHTML = `紫外線指數: <span class="font-semibold text-slate-400">0 (低)</span>`;
        }

        if (data.icon && data.icon.length > 0) {
          const iconCode = data.icon[0];
          document.getElementById('weatherIcon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
        }

        const warningBadge = document.getElementById('warningBadge');
        if (data.warningMessage && data.warningMessage.length > 0) {
          warningBadge.classList.remove('hidden');
          warningBadge.textContent = data.warningMessage[0];
        } else {
          warningBadge.classList.add('hidden');
        }

      } catch (err) {
        console.error('HKO Weather Fetch Error:', err);
      }
    }

            await fetchCtbEta(route);

            await fetchMtrBusEta(route);
          } else if (route.type === 'MTR') {

            await fetchLrtEta(route);

    async function fetchKmbEta(route) {
      try {
        const stopId = route.stopId;
        const routeNo = route.routeNo;
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
        const data = await res.json();

        if (data && data.data) {
          const now = new Date();
          const filtered = data.data
            .filter(item => item.route === routeNo && item.eta && (!route.boundDir || item.dir === route.boundDir))
            .map(item => Math.round((new Date(item.eta) - now) / 60000))
            .filter(m => m >= 0)
            .sort((a, b) => a - b);

          if (filtered.length > 0) {
            updateCardEtaUI(route.id, filtered[0] === 0 ? '即將' : filtered[0], filtered[1] !== undefined ? filtered[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function fetchCtbEta(route) {
      try {
        const stopId = route.stopId;
        const routeNo = route.routeNo;
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${stopId}/${routeNo}`);
        const data = await res.json();

        if (data && data.data) {
          const now = new Date();
          const targetDir = route.boundDir || 'O';
          const filtered = data.data
            .filter(item => item.eta && (item.dir === targetDir || !item.dir))
            .map(item => Math.round((new Date(item.eta) - now) / 60000))
            .filter(m => m >= 0)
            .sort((a, b) => a - b);

          if (filtered.length > 0) {
            updateCardEtaUI(route.id, filtered[0] === 0 ? '即將' : filtered[0], filtered[1] !== undefined ? filtered[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function fetchMtrBusEta(route) {
      try {
        const routeName = route.routeNo;
        const targetStopId = route.stopId;

        const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            routeName: routeName,
            language: 'zh'
          })
        });

        const data = await response.json();
        
        if (data && (data.busStop || data.busStopList)) {
          const stopList = data.busStop || data.busStopList || [];
          const targetNormalized = normalizeMtrBusStopId(targetStopId);
          const matchedStop = stopList.find(s => {
            const sid = s.busStopId || s.busStopCode || s.stopId || '';
            return sid === targetStopId || sid === targetStopId?.toUpperCase() || normalizeMtrBusStopId(sid) === targetNormalized;
          });

          if (matchedStop && matchedStop.bus && matchedStop.bus.length > 0) {
            const minutesList = matchedStop.bus.map(b => {
              if (b.arrivalTimeInSecond !== undefined) {
                return Math.max(0, Math.round(parseInt(b.arrivalTimeInSecond) / 60));
              }
              if (b.arrivalTimeText) {
                const match = b.arrivalTimeText.match(/\d+/);
                return match ? parseInt(match[0]) : 0;
              }
              return null;
            }).filter(m => m !== null);

            if (minutesList.length > 0) {
              updateCardEtaUI(route.id, minutesList[0] === 0 ? '即將' : minutesList[0], minutesList[1] !== undefined ? minutesList[1] : '');
              return;
            }
          }
        }
        updateCardEtaUI(route.id, '暫無班次', '');
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    function getCanonicalMtrStationCode(line, sta) {
      const aliases = {
        TML: { TSW: 'TIS' },
        TWL: { TSW: 'TSU' },
        EAL: { EXH: 'EXC' },
        TKL: { TTI: 'TIK', HAO: 'HAH' }
      };
      const key = String(sta || '').trim().toUpperCase();
      return (aliases[String(line || '').toUpperCase()] || {})[key] || key;
    }

    function getMtrStationName(line, sta) {
      const lineObj = MTR_LINES.find(l => l.code === line);
      const station = lineObj && lineObj.stations.find(s => s.code === sta);
      return station ? station.name : sta;
    }

    function updateMtrDirectionOptionLabels(line, sta) {
      const boundSelect = document.getElementById('mtrBoundSelect');
      if (!boundSelect) return;

      const upOpt = boundSelect.querySelector('option[value="UP"]');
      const downOpt = boundSelect.querySelector('option[value="DOWN"]');
      if (upOpt) upOpt.textContent = 'UP（API 上行方向）';
      if (downOpt) downOpt.textContent = 'DOWN（API 下行方向）';

      // Do not guess geography-specific directions. UP/DOWN are the MTR API
      // direction keys; the live card uses the actual destination returned by API.
    }

    async function fetchMtrEta(route) {
      try {
        const line = String(route.line || 'TML').trim().toUpperCase();
        const sta = getCanonicalMtrStationCode(line, route.sta || 'YUL');
        const dir = String(route.dir || 'DOWN').trim().toUpperCase();

        if (!['UP', 'DOWN'].includes(dir)) {
          updateCardEtaUI(route.id, '暫無班次', '');
          return;
        }

        const lineObj = MTR_LINES.find(l => l.code === line);
        const stationObj = lineObj && lineObj.stations.find(s => s.code === sta);
        if (!lineObj || !stationObj) {
          console.warn('MTR station code not found in local catalogue:', line, sta);
          updateCardEtaUI(route.id, '暫無班次', '');
          return;
        }

        // Keep legacy saved configurations working after station-code corrections.
        if (route.sta !== sta) {
          route.sta = sta;
          try {
            localStorage.setItem('hk_dashboard_config_v5', JSON.stringify(appConfig));
          } catch (e) {}
        }

        const res = await fetch(
          `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${encodeURIComponent(line)}&sta=${encodeURIComponent(sta)}&lang=TC`,
          { cache: 'no-store' }
        );
        if (!res.ok) throw new Error(`MTR API HTTP ${res.status}`);

        const data = await res.json();
        const stationKey = `${line}-${sta}`;
        const stationData = data && data.data && data.data[stationKey];

        if (Number(data && data.status) === 1 && stationData) {
          const scheduleData = Array.isArray(stationData[dir]) ? stationData[dir] : [];

          const validEntries = scheduleData
            .filter(item => item && String(item.valid || 'Y').toUpperCase() !== 'N')
            .map(item => {
              const mins = Number(item.ttnt);
              return Number.isFinite(mins) && mins >= 0 ? {
                mins,
                dest: item.dest || '',
                time: item.time || '',
                seq: Number(item.seq) || 999
              } : null;
            })
            .filter(Boolean)
            .sort((a, b) => a.mins - b.mins || a.seq - b.seq);

          if (validEntries.length > 0) {
            const first = validEntries[0];
            const second = validEntries[1];

            // Preserve the existing card layout, but show the actual API
            // destination so the displayed direction is never guessed.
            if (first.dest) {
              const destName = getMtrStationName(line, first.dest);
              const card = document.getElementById(`card-${route.id}`);
              if (card) {
                const directionEl = card.querySelector('.mtr-live-direction');
                if (directionEl) directionEl.textContent = `往 ${destName}`;
              }
              route._liveDest = destName;
            }

            updateCardEtaUI(
              route.id,
              first.mins === 0 ? '即將' : first.mins,
              second ? (second.mins === 0 ? '即將' : second.mins) : ''
            );
            return;
          }
        }

        updateCardEtaUI(route.id, '暫無班次', '');
      } catch (err) {
        console.warn('MTR ETA fetch failed:', err);
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    function normalizeStationName(name) {
      if (!name) return '';
      return String(name)
        .replace(/[（(].*?[）)]/g, '')
        .replace(/站$/g, '')
        .replace(/總站$/g, '')
        .replace(/車站$/g, '')
        .trim();
    }

    async function fetchStationSchedule(stId, includeSpecial = false) {
      try {
        const qs = `station_id=${encodeURIComponent(stId)}&with_special=${includeSpecial ? '1' : '0'}`;
        const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?${qs}`);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function getRouteNumberFromItem(item) {
      if (!item) return '';
      if (Number(item.special) === 1) {
        return String(item.additionalInfo1 || '').replace(/\*+$/g, '').trim();
      }
      return String(item.route_no || '').trim();
    }

    function parseLrtMinutes(item) {
      const timeText = String(item?.time_ch ?? item?.time_en ?? '').trim();
      if (!timeText || timeText === '-' || /即將|抵達|到達|離開|正在離開/.test(timeText)) return 0;
      const match = timeText.match(/(\d+(?:\.\d+)?)/);
      if (!match) return null;
      const value = Number(match[1]);
      return Number.isFinite(value) ? Math.max(0, Math.round(value)) : null;
    }

    function doesRouteServeTrip(routeNo, originStationId, targetDestNorm, trainDestCh) {
      const routeInfo = getLrtRouteInfo(routeNo);
      if (!routeInfo) return false;

      const trainDestNorm = normalizeStationName(trainDestCh);
      const sequences = getLrtDirectionSequences(routeInfo);
      for (const seq of sequences) {
        const originIdx = seq.findIndex(st => st.id === originStationId);
        if (originIdx === -1) continue;

        if (!targetDestNorm) return true;

        const destIdx = seq.findIndex(st => normalizeStationName(st.name) === targetDestNorm);
        if (destIdx === -1 || originIdx >= destIdx) continue;

        if (!trainDestNorm) return false;
        const trainDestIdx = seq.findIndex(st => normalizeStationName(st.name) === trainDestNorm);
        if (trainDestIdx === -1) continue;

        if (trainDestIdx >= destIdx) return true;
      }
      return false;
    }

    function isSpecialRouteItemFor(item, requestedRouteNo) {
      if (!item || Number(item.special) !== 1) return false;
      const reported = String(item.additionalInfo1 || '').replace(/\*+$/g, '').trim();
      return reported === String(requestedRouteNo);
    }

    function collectLrtDepartures(data, route, allowSpecial = false) {
      const result = [];
      if (!data || Number(data.status) !== 1 || !Array.isArray(data.platform_list)) return result;

      const isAllRoutes = route.isAllRoutes || route.routeNo === '所有路線' || route.routeNo === 'ALL';
      const targetRouteNo = isAllRoutes ? '' : String(route.routeNo);
      const targetDestNorm = normalizeStationName(route.destStationName || route.dest || '');

      data.platform_list.forEach(platform => {
        const platformId = platform.platform_id;
        (platform.route_list || []).forEach(item => {
          const isSpecial = Number(item.special) === 1;
          if (isSpecial && !allowSpecial) return;

          const itemRouteNo = getRouteNumberFromItem(item);
          if (!isAllRoutes) {
            if (itemRouteNo !== targetRouteNo) return;
            if (!isSpecial && !doesRouteServeTrip(targetRouteNo, route.stationId, targetDestNorm, item.dest_ch)) return;
            if (isSpecial && !isSpecialRouteItemFor(item, targetRouteNo)) return;
            if (isSpecial && targetDestNorm && normalizeStationName(item.dest_ch) !== targetDestNorm) return;
          } else if (targetDestNorm && !isSpecial && !doesRouteServeTrip(itemRouteNo, route.stationId, targetDestNorm, item.dest_ch)) {
            return;
          } else if (targetDestNorm && isSpecial) {
            return;
          }

          const mins = parseLrtMinutes(item);
          if (mins === null) return;
          result.push({
            routeNo: itemRouteNo,
            platformId: `${platformId}號月台`,
            dest: item.dest_ch || '—',
            mins,
            timeText: item.time_ch || item.time_en || '',
            isPrediction: false,
            special: isSpecial
          });
        });
      });

      return result.sort((a, b) => a.mins - b.mins);
    }

    async function fetchLrtEta(route) {
      try {
        const stationId = route.stationId;
        if (!stationId) {
          updateCardEtaUI(route.id, '暫無班次', '');
          return;
        }

        const isAllRoutes = route.isAllRoutes || route.routeNo === '所有路線' || route.routeNo === 'ALL';
        const isSpecialSavedRoute = !isAllRoutes && !getLrtRouteInfo(route.routeNo);
        const includeSpecial = isSpecialSavedRoute || false;

        const data = await fetchStationSchedule(stationId, includeSpecial);
        let departureList = collectLrtDepartures(data, route, includeSpecial);

        departureList = departureList
          .filter((item, idx, arr) => idx === arr.findIndex(x => x.routeNo === item.routeNo && x.mins === item.mins && x.platformId === item.platformId))
          .slice(0, 2);

        if (departureList.length > 0) {
          updateCardLrtAllRoutesUI(route.id, departureList[0], departureList[1]);
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        console.warn('LRT ETA fetch failed:', err);
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function preloadBusRoutes(op) {
      const routeDropdown = document.getElementById('routeSelectDropdown');
      routeDropdown.innerHTML = '<option value="">載入路線清單中...</option>';

      try {
        let url = '';
        if (op === 'KMB') {
          url = 'https://data.etabus.gov.hk/v1/transport/kmb/route';
        } else if (op === 'CTB') {
          url = 'https://rt.data.gov.hk/v2/transport/citybus/route/ctb';
        }

        const res = await fetch(url);
        const data = await res.json();

        fetchedBusRoutes = data.data || [];
        routeDropdown.innerHTML = '<option value="">-- 請在上方輸入號碼搜尋 (例如: 1A, 102, 68X...) --</option>';
      } catch (e) {
        routeDropdown.innerHTML = '<option value="">載入路線失敗，請重新開啟視窗</option>';
      }
    }

    function filterBusRoutes() {
      const keyword = document.getElementById('routeSearchInput').value.trim().toUpperCase();
      const dropdown = document.getElementById('routeSelectDropdown');
      dropdown.innerHTML = '';

      if (!keyword) {
        dropdown.innerHTML = '<option value="">-- 請輸入路線號碼 --</option>';
        return;
      }

      if (selectedOperator === 'KMB') {
        const matches = fetchedBusRoutes.filter(r => (r.route || '').toUpperCase().startsWith(keyword));
        if (matches.length === 0) {
          dropdown.innerHTML = `<option value="">未找到匹配 ${keyword} 的九巴路線</option>`;
          return;
        }

        dropdown.innerHTML = '<option value="">-- 請選擇路線及方向 --</option>';
        matches.slice(0, 40).forEach(r => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({
            route: r.route,
            boundDir: r.bound,
            dirApi: r.bound === 'I' ? 'inbound' : 'outbound',
            serviceType: r.service_type || '1',
            orig_tc: r.orig_tc,
            dest_tc: r.dest_tc
          });
          opt.textContent = `${r.route}: ${r.orig_tc} 往 ${r.dest_tc}`;
          dropdown.appendChild(opt);
        });
      } else if (selectedOperator === 'CTB') {
        const matches = fetchedBusRoutes.filter(r => (r.route || '').toUpperCase().startsWith(keyword));
        if (matches.length === 0) {
          dropdown.innerHTML = `<option value="">未找到匹配 ${keyword} 的城巴路線</option>`;
          return;
        }

        dropdown.innerHTML = '<option value="">-- 請選擇路線及方向 --</option>';
        matches.slice(0, 30).forEach(r => {
          const optOut = document.createElement('option');
          optOut.value = JSON.stringify({
            route: r.route,
            boundDir: 'O',
            dirApi: 'outbound',
            orig_tc: r.orig_tc,
            dest_tc: r.dest_tc
          });
          optOut.textContent = `${r.route}: ${r.orig_tc} 往 ${r.dest_tc}`;
          dropdown.appendChild(optOut);

          const optIn = document.createElement('option');
          optIn.value = JSON.stringify({
            route: r.route,
            boundDir: 'I',
            dirApi: 'inbound',
            orig_tc: r.dest_tc,
            dest_tc: r.orig_tc
          });
          optIn.textContent = `${r.route}: ${r.dest_tc} 往 ${r.orig_tc}`;
          dropdown.appendChild(optIn);
        });
      }
    }

    async function onMtrBusRouteSelected() {
      const val = document.getElementById('mtrBusRouteSelect').value;
      const stopSelect = document.getElementById('mtrBusStopSelect');
      stopSelect.innerHTML = '<option value="">載入中...</option>';

      if (!val) return;
      const routeInfo = JSON.parse(val);

      try {
        await loadAllMtrBusStationsMaster();

        const schedRes = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            routeName: routeInfo.route,
            language: 'zh'
          })
        });
        const schedData = await schedRes.json();
        const rawStopList = schedData.busStop || schedData.busStopList || [];

        stopSelect.innerHTML = '';

        const targetDir = String(routeInfo.boundDir || 'D').toUpperCase();
        const filteredStops = rawStopList.filter(s => {
          const sidRaw = s.busStopId || s.busStopCode || s.stopId || s.stop_code || '';
          const sid = normalizeMtrBusStopId(sidRaw);
          if (!sid.includes('-')) return true;
          return sid.includes(`-${targetDir}`);
        });

        const stopList = filteredStops.length > 0 ? filteredStops : rawStopList;

        if (stopList.length > 0) {
          stopList.forEach((s, idx) => {
            const stopId = s.busStopId || s.busStopCode || s.stopId || s.stop_code || `STOP-${idx + 1}`;
            const sequence = Number(s.seq || s.sequence || s.stopSeq || s.stopSequence || idx + 1) || (idx + 1);
            const rawApiName = s.busStopChineseName || s.busStopNameChi || s.busStopName || s.nameChi || s.name || s.stop_name_tc;
            const displayName = getMtrBusStationName(stopId, routeInfo.route, rawApiName, sequence);

            const opt = document.createElement('option');
            opt.value = JSON.stringify({
              stopId: stopId,
              stopName: displayName
            });
            opt.textContent = `${sequence}. ${displayName}`;
            stopSelect.appendChild(opt);
          });
        } else {
          stopSelect.innerHTML = '<option value="">未能取得站點清單</option>';
        }
      } catch (err) {
        stopSelect.innerHTML = '<option value="">載入失敗，請重試</option>';
      }
    }

    function initLrtDropdown() {
      const routeSelect = document.getElementById('lrtRouteSelect');
      if (!routeSelect) return;
      routeSelect.innerHTML = '';

      const allOpt = document.createElement('option');
      allOpt.value = 'ALL';
      allOpt.textContent = '🌟 所有路線 (顯示最近2班官方列車)';
      routeSelect.appendChild(allOpt);

      LRT_ROUTES.forEach((r) => {
        const opt = document.createElement('option');
        opt.value = r.route;
        opt.textContent = `輕鐵 ${r.route} 綫`;
        routeSelect.appendChild(opt);
      });

      routeSelect.selectedIndex = 0;
      onLrtRouteSelected();
    }

    function onLrtRouteSelected() {
      const routeNo = document.getElementById('lrtRouteSelect').value;
      const originSelect = document.getElementById('lrtOriginSelect');
      const destSelect = document.getElementById('lrtDestSelect');

      if (!originSelect || !destSelect) return;
      originSelect.innerHTML = '<option value="">-- 請選擇上車站點 --</option>';
      destSelect.innerHTML = '<option value="">-- 請先選擇上車站點 --</option>';
      if (!routeNo) return;

      if (routeNo === 'ALL') {
        getAllLrtStations().forEach((st, idx) => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({ stationId: st.id, stationName: st.name, index: idx });
          opt.textContent = `${st.name}站 (編號: ${st.id})`;
          originSelect.appendChild(opt);
        });
        if (originSelect.options.length > 1) {
          originSelect.selectedIndex = 0;
          onLrtOriginChanged();
        }
        return;
      }

      const routeInfo = getLrtRouteInfo(routeNo);
      if (!routeInfo) return;

      getLrtRouteStationUnion(routeInfo).forEach((st, idx) => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ stationId: st.id, stationName: st.name, index: idx });
        opt.textContent = `${idx + 1}. ${st.name}站 (${st.id})`;
        originSelect.appendChild(opt);
      });

      if (originSelect.options.length > 1) {
        originSelect.selectedIndex = 0;
        onLrtOriginChanged();
      }
    }

    function onLrtOriginChanged() {
      const routeNo = document.getElementById('lrtRouteSelect').value;
      const originVal = document.getElementById('lrtOriginSelect').value;
      const destSelect = document.getElementById('lrtDestSelect');

      if (!destSelect) return;
      destSelect.innerHTML = '<option value="">-- 請選擇落車站點 --</option>';
      if (!routeNo || !originVal) return;

      const originObj = JSON.parse(originVal);

      if (routeNo === 'ALL') {
        const allDestOpt = document.createElement('option');
        allDestOpt.value = JSON.stringify({ stationId: 'ALL', stationName: '所有目的地' });
        allDestOpt.textContent = '🌟 所有目的地 (不限方向)';
        destSelect.appendChild(allDestOpt);

        getAllLrtStations().forEach(st => {
          if (st.id !== originObj.stationId) {
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ stationId: st.id, stationName: st.name });
            opt.textContent = `${st.name}站 (${st.id})`;
            destSelect.appendChild(opt);
          }
        });
        destSelect.selectedIndex = 0;
        return;
      }

      const routeInfo = getLrtRouteInfo(routeNo);
      getReachableLrtDestinations(routeInfo, originObj.stationId).forEach((st) => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ stationId: st.id, stationName: st.name });
        opt.textContent = `${st.name}站 (${st.id})`;
        destSelect.appendChild(opt);
      });

      if (destSelect.options.length > 1) destSelect.selectedIndex = 1;
    }

    function initModalSelectors() {
      const lineSelect = document.getElementById('mtrLineSelect');
      lineSelect.innerHTML = '';
      MTR_LINES.forEach((line, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = line.name;
        lineSelect.appendChild(opt);
      });
      onMtrLineChange();
    }

    function onMtrLineChange() {
      const idx = document.getElementById('mtrLineSelect').value;
      const stationSelect = document.getElementById('mtrStationSelect');
      stationSelect.innerHTML = '';

      const stations = MTR_LINES[idx].stations;
      stations.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st.code;
        opt.textContent = st.name;
        stationSelect.appendChild(opt);
      });

      updateMtrDirectionOptionLabels(MTR_LINES[idx].code, stationSelect.value);
    }

    function addSelectedRoute() {
      if (selectedOperator === 'KMB' || selectedOperator === 'CTB') {
        const routeVal = document.getElementById('routeSelectDropdown').value;
        const stopVal = document.getElementById('stopSelectDropdown').value;

        if (!routeVal || !stopVal) return;

        const routeObj = JSON.parse(routeVal);
        const stopObj = JSON.parse(stopVal);

        const newRoute = {
          id: 'custom-' + Date.now(),
          type: selectedOperator,
          badgeText: selectedOperator === 'KMB' ? '九巴 KMB' : '城巴 CTB',
          routeNo: routeObj.route,
          origin: stopObj.stopName,
          dest: routeObj.dest_tc || '總站',
          stopId: stopObj.stopId,
          boundDir: routeObj.boundDir
        };

        appConfig.routes.push(newRoute);
      } else if (selectedOperator === 'MTRBUS') {
        const routeVal = document.getElementById('mtrBusRouteSelect').value;
        const stopVal = document.getElementById('mtrBusStopSelect').value;

        if (!routeVal || !stopVal) return;

        const routeObj = JSON.parse(routeVal);
        const stopObj = JSON.parse(stopVal);

        const newRoute = {
          id: 'custom-' + Date.now(),
          type: 'MTRBUS',
          badgeText: '港鐵巴士',
          routeNo: routeObj.route,
          origin: stopObj.stopName,
          dest: routeObj.dest_tc,
          stopId: stopObj.stopId,
          boundDir: routeObj.boundDir
        };

        appConfig.routes.push(newRoute);
      } else if (selectedOperator === 'MTR') {
        const lineIdx = document.getElementById('mtrLineSelect').value;
        const lineObj = MTR_LINES[lineIdx];
        const staCode = document.getElementById('mtrStationSelect').value;
        const staName = document.getElementById('mtrStationSelect').selectedOptions[0].text;
        const dir = document.getElementById('mtrBoundSelect').value;

        const newRoute = {
          id: 'custom-' + Date.now(),
          type: 'MTR',
          badgeText: '港鐵 MTR',
          routeNo: lineObj.name.split(' ')[0],
          origin: staName + '站',
          dest: dir === 'DOWN' ? '下行/往終點方向' : '上行/往終點方向',
          line: lineObj.code,
          sta: staCode,
          dir: dir
        };

        appConfig.routes.push(newRoute);
      } else if (selectedOperator === 'LRT') {
        const routeNo = document.getElementById('lrtRouteSelect').value;
        const originVal = document.getElementById('lrtOriginSelect').value;
        const destVal = document.getElementById('lrtDestSelect').value;

        if (!routeNo || !originVal || !destVal) return;

        const originObj = JSON.parse(originVal);
        const destObj = JSON.parse(destVal);
        const isAll = (routeNo === 'ALL');

        const newRoute = {
          id: 'custom-' + Date.now(),
          type: 'LRT',
          badgeText: '輕鐵 LRT',
          routeNo: isAll ? '所有路線' : routeNo,
          origin: originObj.stationName + '站',
          dest: destObj.stationId === 'ALL' ? '所有目的地' : destObj.stationName + '站',
          stationId: originObj.stationId,
          destStationName: destObj.stationName,
          isAllRoutes: isAll
        };

        appConfig.routes.push(newRoute);
      }

      renderModalRouteList();
    }

    function renderModalRouteList() {
      const container = document.getElementById('modalRouteList');
      container.innerHTML = '';

      (appConfig.routes || []).forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-900 px-3 py-2 rounded text-xs border border-slate-700';
        item.innerHTML = `
          <div class="truncate mr-2">
            <span class="font-bold text-amber-400">[${r.badgeText || r.type}] ${r.routeNo}</span>
            <span class="text-slate-300 ml-1.5">${r.origin} 往 ${r.dest}</span>
          </div>
          <button onclick="removeRouteAt(${idx})" class="text-rose-400 hover:text-rose-300 font-bold p-1 shrink-0">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        container.appendChild(item);
      });
    }

    function removeRouteAt(idx) {
      appConfig.routes.splice(idx, 1);
      renderModalRouteList();
    }

    function addDefaultPresets() {
      appConfig.routes = [];
      renderModalRouteList();
    }

    function saveSettings() {
      const mode = document.getElementById('selectCountdownMode').value;
      appConfig.countdownMode = mode;

      if (mode === 'SELECT_HOLIDAY') {
        const holidayVal = document.getElementById('selectSpecificHoliday').value;
        if (holidayVal) {
          const hObj = JSON.parse(holidayVal);
          appConfig.countdownTitle = hObj.name;
          appConfig.countdownDate = hObj.date;
        }
      } else if (mode === 'CUSTOM') {
        appConfig.countdownTitle = document.getElementById('inputCountdownTitle').value;
        appConfig.countdownDate = document.getElementById('inputCountdownDate').value;
      }

      appConfig.weatherStation = document.getElementById('selectWeatherStation').value;
      localStorage.setItem('hk_dashboard_config_v5', JSON.stringify(appConfig));

      closeModal('customModal');
      fetchWeatherData();
      renderRouteCards();
      fetchEtaData();
    }
  </script>
</body>
</html>
