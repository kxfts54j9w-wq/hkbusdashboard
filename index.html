<!DOCTYPE html>
<html lang="zh-HK" class="h-full w-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>香港公共交通與天文台天氣 Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kmb: '#e11d48',
            ctb: '#eab308',
            mtr: '#00508f',
            bgDark: '#0b0e14',
            cardDark: '#161b26'
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      overscroll-behavior: none;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="text-white min-h-screen md:h-full w-full flex flex-col justify-between p-2 sm:p-4 box-border overflow-y-auto md:overflow-hidden bg-bgDark">

  <!-- Header bar -->
  <header class="flex justify-between items-center px-1 sm:px-2 py-1 mb-1 text-xs text-slate-400 shrink-0">
    <div class="flex items-center gap-1.5 sm:gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse-fast"></span>
      <span id="liveStatusText" class="font-mono tracking-tight text-[11px] sm:text-xs">即時更新 (每15秒)</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="toggleFullscreen()" class="hover:text-white p-1" title="全屏切換">
        <i class="fa-solid font-bold fa-expand"></i>
      </button>
      <button onclick="openModal('customModal')" class="hover:text-white flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 sm:px-2.5 py-1 rounded-full text-[11px] sm:text-xs transition border border-slate-700">
        <i class="fa-solid fa-sliders text-[11px]"></i>
        <span>自訂路線及天氣設定</span>
      </button>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 min-h-0 w-full overflow-y-auto md:overflow-hidden pb-4 md:pb-0">
    
    <!-- Left Section: HKO Weather & Clock -->
    <section class="md:col-span-5 lg:col-span-4 bg-cardDark rounded-2xl p-3 sm:p-4 flex flex-col justify-between border border-slate-800 shadow-2xl overflow-y-auto custom-scrollbar shrink-0 max-h-full">
      <div>
        <div class="flex justify-between items-center text-slate-300 font-medium mb-1">
          <div class="flex items-center gap-2 text-xs sm:text-sm">
            <span><i class="fa-solid fa-arrow-down text-blue-400"></i> <span id="minTemp">--</span>°C</span>
            <span><i class="fa-solid fa-arrow-up text-rose-400"></i> <span id="maxTemp">--</span>°C</span>
          </div>
          <button onclick="fetchWeatherData()" title="重新整理天氣" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </button>
        </div>

        <div class="flex justify-between items-center my-1 sm:my-2">
          <div>
            <div id="currentTemp" class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight font-mono text-white">
              --.-°C
            </div>
            <div id="humidity" class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-200 mt-1 font-mono">
              --%
            </div>
          </div>
          <div class="flex flex-col items-center justify-center min-w-[70px] sm:min-w-[80px]">
            <img id="weatherIcon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic50.png" alt="Weather Icon" class="w-16 h-16 sm:w-20 sm:h-20 object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://placehold.co/80x80/000000/FFF?text=HKO';">
          </div>
        </div>

        <div class="space-y-1 mt-1 sm:mt-2">
          <div class="flex items-center gap-2 flex-wrap">
            <h2 id="stationName" class="text-xl sm:text-2xl font-bold tracking-wide text-slate-100">京士柏</h2>
            <span id="warningBadge" class="hidden text-[10px] sm:text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">天氣警告</span>
          </div>
          <p id="uvIndex" class="text-xs sm:text-sm text-slate-300">紫外線指數: <span class="font-semibold">--</span></p>
        </div>
      </div>

      <!-- Expanded Prominent Countdown Section (Optimized for iPhone / Mobile) -->
      <div class="my-2 sm:my-3 bg-gradient-to-br from-amber-950/70 via-amber-900/40 to-slate-900/90 border border-amber-500/40 rounded-xl p-3 sm:p-3.5 shadow-lg relative overflow-hidden">
        <!-- Background Decorative Icon positioned safely at bottom right -->
        <div class="absolute -bottom-2 -right-2 text-amber-500/10 text-6xl sm:text-7xl font-black pointer-events-none select-none z-0">
          <i class="fa-solid fa-calendar-days"></i>
        </div>

        <div class="relative z-10">
          <div class="flex items-center justify-between gap-1 mb-1 flex-wrap">
            <div class="flex items-center gap-1.5 text-[11px] sm:text-xs text-amber-300 font-bold uppercase tracking-wider min-w-0">
              <i class="fa-solid fa-plane-departure text-amber-400 shrink-0"></i>
              <span id="countdownLabel" class="truncate">香港公眾假期 (自動)</span>
            </div>
            <span id="autoBadge" class="text-[9px] sm:text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded shrink-0">自動追蹤</span>
          </div>

          <div class="mt-1">
            <h3 id="countdownTitle" class="text-lg sm:text-2xl font-black text-white tracking-wide truncate">
              --
            </h3>
            <p id="countdownSubdate" class="text-[11px] sm:text-xs text-amber-200/80 font-medium mt-0.5">
              ----年--月--日
            </p>
          </div>

          <div class="mt-2 pt-2 border-t border-amber-500/20 flex items-baseline justify-between">
            <span class="text-xs text-slate-300 font-semibold shrink-0">距離放假還有</span>
            <div class="flex items-baseline gap-1 shrink-0">
              <span id="countdownDays" class="text-4xl sm:text-6xl font-black font-mono text-amber-400 drop-shadow-md">--</span>
              <span class="text-base sm:text-lg font-extrabold text-amber-300">天</span>
            </div>
          </div>
        </div>
      </div>

      <div class="pt-2 border-t border-slate-800/80 flex flex-col items-start justify-end">
        <div id="clockDisplay" class="text-4xl sm:text-5xl lg:text-6xl font-extrabold font-mono tracking-wider text-white">
          00:00:00
        </div>
        <div id="dateDisplay" class="mt-1 bg-cyan-950/80 border border-cyan-800/60 text-cyan-300 px-2.5 sm:px-3 py-1 rounded-md text-xs sm:text-sm font-semibold tracking-wide">
          ----年--月--日(--)
        </div>
      </div>
    </section>

    <!-- Right Section: Transport Arrival Times List -->
    <section class="md:col-span-7 lg:col-span-8 flex flex-col bg-cardDark rounded-2xl border border-slate-800 overflow-hidden shadow-2xl min-h-[300px] md:min-h-0">
      <div class="bg-red-800 px-3 sm:px-4 py-2.5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <h1 class="text-lg sm:text-xl font-extrabold text-white tracking-wide">到站時間</h1>
          <span id="routeCountBadge" class="bg-black/30 text-white text-[11px] sm:text-xs px-2 sm:px-2.5 py-0.5 rounded-full font-medium">0 條路線</span>
        </div>
        <div class="text-[11px] sm:text-xs text-red-100/80 font-medium">
          分鐘 min(s)
        </div>
      </div>

      <div id="transitCardList" class="flex-1 p-2.5 sm:p-3 space-y-2.5 sm:space-y-3 overflow-y-auto custom-scrollbar">
        <!-- Live Route Cards rendered here -->
      </div>
    </section>

  </main>

  <!-- Configuration Modal -->
  <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90dvh] flex flex-col shadow-2xl overflow-hidden">
      
      <div class="p-3.5 sm:p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
        <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-bus text-amber-400"></i> 自訂香港巴士,重鐵及天氣
        </h3>
        <button onclick="closeModal('customModal')" class="text-slate-400 hover:text-white p-1 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3.5 sm:p-4 overflow-y-auto space-y-4 sm:space-y-5 custom-scrollbar text-xs sm:text-sm">
        
        <!-- Weather Station & Event Config -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700">
            <h4 class="font-bold text-slate-200 mb-2 flex items-center gap-2 text-xs">
              <i class="fa-solid fa-cloud-sun text-amber-400"></i> 天文台氣象站
            </h4>
            <select id="selectWeatherStation" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
              <option value="京士柏">京士柏 (King's Park)</option>
              <option value="香港天文台">香港天文台 (Hong Kong Observatory)</option>
              <option value="屯門">屯門 (Tuen Mun)</option>
              <option value="沙田">沙田 (Sha Tin)</option>
              <option value="元朗公園">元朗公園 (Yuen Long)</option>
              <option value="旺角">旺角 (Mong Kok)</option>
              <option value="觀塘">觀塘 (Kwun Tong)</option>
              <option value="將軍澳">將軍澳 (Tseung Kwan O)</option>
              <option value="荃灣">荃灣 (Tsuen Wan)</option>
              <option value="赤鱲角">赤鱲角 (Chek Lap Kok)</option>
            </select>
          </div>

          <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700">
            <h4 class="font-bold text-slate-200 mb-2 flex items-center gap-2 text-xs">
              <i class="fa-solid fa-calendar-check text-amber-400"></i> 倒數模式設定
            </h4>
            <div class="space-y-1.5">
              <select id="selectCountdownMode" onchange="toggleCountdownInputMode()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                <option value="AUTO_HK">🤖 自動追蹤下個香港公眾假期</option>
                <option value="SELECT_HK">📅 選擇指定香港公眾假期</option>
                <option value="CUSTOM">✏️ 完全自訂日期與名稱</option>
              </select>

              <!-- Dropdown for HK holidays -->
              <select id="selectHkHolidayDropdown" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white hidden">
                <!-- Dynamic choices populated in JS -->
              </select>

              <!-- Custom inputs -->
              <div id="customCountdownFields" class="space-y-1 hidden">
                <input type="text" id="inputCountdownTitle" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white" placeholder="自訂目標名稱 (如：生日/旅行)">
                <input type="date" id="inputCountdownDate" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white">
              </div>
            </div>
          </div>
        </div>

        <!-- Add New Transit Route with Search and Selector -->
        <div class="bg-slate-800/80 p-3 sm:p-3.5 rounded-xl border border-amber-500/30 space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
            <h4 class="font-bold text-amber-400 flex items-center gap-1.5 text-xs sm:text-sm">
              <i class="fa-solid fa-magnifying-glass"></i> 搜尋及新增路線
            </h4>
            <span class="text-[10px] sm:text-[11px] text-slate-400">九巴/城巴/港鐵巴士/重鐵</span>
          </div>

          <!-- Transport Operator Tabs (4 column mobile grid) -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-1 bg-slate-950 p-1 rounded-lg text-center text-[11px] sm:text-xs">
            <button id="tab-KMB" onclick="selectOperator('KMB')" class="py-1.5 rounded font-bold transition bg-rose-600 text-white">九巴/龍運</button>
            <button id="tab-CTB" onclick="selectOperator('CTB')" class="py-1.5 rounded font-bold transition text-slate-400 hover:text-white">城巴 CTB</button>
            <button id="tab-MTRBUS" onclick="selectOperator('MTRBUS')" class="py-1.5 rounded font-bold transition text-slate-400 hover:text-white">港鐵巴士</button>
            <button id="tab-MTR" onclick="selectOperator('MTR')" class="py-1.5 rounded font-bold transition text-slate-400 hover:text-white">港鐵重鐵</button>
          </div>

          <!-- Dynamic Search Section based on Operator -->
          <div id="searchContainerBus" class="space-y-2">
            <div class="flex gap-2">
              <input type="text" id="routeSearchInput" onkeyup="filterBusRoutes()" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400" placeholder="輸入號碼 (例如: 1A, 102, K51, 506, A21...)">
              <button onclick="filterBusRoutes()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs text-white font-bold shrink-0">
                搜尋
              </button>
            </div>

            <!-- Route Result Selector -->
            <div>
              <label class="text-[10px] sm:text-[11px] text-slate-400 block mb-1">選擇路線及方向：</label>
              <select id="routeSelectDropdown" onchange="onRouteSelected()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <option value="">-- 請先輸入路線號碼搜尋 --</option>
              </select>
            </div>

            <!-- Stop Result Selector -->
            <div>
              <label class="text-[10px] sm:text-[11px] text-slate-400 block mb-1">選擇上車站點：</label>
              <select id="stopSelectDropdown" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <option value="">-- 請先選擇路線 --</option>
              </select>
            </div>
          </div>

          <!-- Search Section for MTR Heavy Rail -->
          <div id="searchContainerMTR" class="space-y-2 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div>
                <label class="text-[10px] sm:text-[11px] text-slate-400 block mb-1">選擇綫路：</label>
                <select id="mtrLineSelect" onchange="onMtrLineChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                  <!-- MTR Lines populated via JS -->
                </select>
              </div>
              <div>
                <label class="text-[10px] sm:text-[11px] text-slate-400 block mb-1">選擇車站：</label>
                <select id="mtrStationSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                  <!-- MTR Stations populated via JS -->
                </select>
              </div>
              <div>
                <label class="text-[10px] sm:text-[11px] text-slate-400 block mb-1">往方向/終點：</label>
                <select id="mtrBoundSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-white">
                  <option value="DOWN">下行 (DOWN / 往屯門/堅尼地城/金鐘/香港...)</option>
                  <option value="UP">上行 (UP / 往烏溪沙/柴灣/羅湖/荃灣...)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Alert message box inside modal for clean notifications -->
          <div id="modalAlertBox" class="hidden p-2 bg-rose-950/80 border border-rose-700 rounded text-rose-200 text-xs text-center font-bold">
          </div>

          <button onclick="addSelectedRoute()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs transition shadow-md">
            + 新增選定路線至首頁 Display
          </button>
        </div>

        <!-- Saved Routes Configurator -->
        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700 space-y-2">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-slate-200 flex items-center gap-2 text-xs">
              <i class="fa-solid fa-list text-emerald-400"></i> 已儲存顯示路線 (可刪除/重置)
            </h4>
            <button onclick="addDefaultPresets()" class="text-[10px] sm:text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200">
              重置為預設路線
            </button>
          </div>

          <div id="modalRouteList" class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar pr-1">
            <!-- Dynamic edit entries -->
          </div>
        </div>

      </div>

      <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end gap-2 shrink-0">
        <button onclick="closeModal('customModal')" class="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded text-slate-200 text-xs font-semibold">
          取消
        </button>
        <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded text-white text-xs font-semibold">
          儲存並更新 Dashboard
        </button>
      </div>

    </div>
  </div>

  <script>

    function initClock() {

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockDisplay').textContent = `${hours}:${mins}:${secs}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      const weekDay = weekDays[now.getDay()];

      document.getElementById('dateDisplay').textContent = `${year}年${month}月${date}日(${weekDay})`;

      updateCountdown();
    }

    function getNextHkHoliday() {
      const today = new Date();
      const todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      for (const h of HK_PUBLIC_HOLIDAYS) {
        const parts = h.date.split('-');
        const hDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        if (hDate >= todayZero) {
          return h;
        }
      }
      return { date: '2027-12-25', title: '聖誕節' };
    }

    function updateCountdown() {
      const mode = appConfig.countdownMode || 'AUTO_HK';
      let title = '';
      let targetStr = '';
      let badgeText = '自動追蹤';

      if (mode === 'AUTO_HK') {
        const nextHoliday = getNextHkHoliday();
        title = nextHoliday.title;
        targetStr = nextHoliday.date;
        badgeText = '香港假期 (自動)';
      } else if (mode === 'SELECT_HK') {
        title = appConfig.countdownTitle || '香港假期';
        targetStr = appConfig.countdownDate || getNextHkHoliday().date;
        badgeText = '指定公眾假期';
      } else {
        title = appConfig.countdownTitle || '自訂倒數';
        targetStr = appConfig.countdownDate || '2026-12-31';
        badgeText = '自訂倒數';
      }

      document.getElementById('countdownTitle').textContent = title;
      document.getElementById('countdownLabel').textContent = badgeText;

      const now = new Date();
      const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      const parts = targetStr.split('-');
      const targetDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      
      const diffTime = targetDate - todayZero;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      const targetWeek = weekDays[targetDate.getDay()];
      document.getElementById('countdownSubdate').textContent = `${parts[0]}年${parts[1]}月${parts[2]}日 (星期${targetWeek})`;

      if (diffDays === 0) {
        document.getElementById('countdownDays').textContent = '今';
      } else if (diffDays > 0) {
        document.getElementById('countdownDays').textContent = diffDays;
      } else {
        document.getElementById('countdownDays').textContent = 0;
      }
    }

    async function fetchWeatherData() {
      try {
        const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await response.json();

        if (data.temperature && data.temperature.data) {
          const selectedStation = appConfig.weatherStation || '京士柏';
          const stationInfo = data.temperature.data.find(s => s.place.includes(selectedStation)) || data.temperature.data[0];
          
          document.getElementById('stationName').textContent = stationInfo.place;
          document.getElementById('currentTemp').textContent = `${stationInfo.value}°C`;

          const temps = data.temperature.data.map(d => d.value);
          document.getElementById('minTemp').textContent = Math.min(...temps);
          document.getElementById('maxTemp').textContent = Math.max(...temps);
        }

        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').textContent = `${data.humidity.data[0].value}%`;
        }

        if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
          const uv = data.uvindex.data[0];
          document.getElementById('uvIndex').innerHTML = `紫外線指數: <span class="font-semibold text-amber-300">${uv.value} (${uv.desc || '低'})</span>`;
        } else {
          document.getElementById('uvIndex').innerHTML = `紫外線指數: <span class="font-semibold text-slate-400">0 (低)</span>`;
        }

        if (data.icon && data.icon.length > 0) {
          const iconCode = data.icon[0];
          document.getElementById('weatherIcon').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
        }

        const warningBadge = document.getElementById('warningBadge');
        if (data.warningMessage && data.warningMessage.length > 0) {
          warningBadge.classList.remove('hidden');
          warningBadge.textContent = data.warningMessage[0];
        } else {
          warningBadge.classList.add('hidden');
        }

      } catch (err) {
        console.error('HKO Weather Fetch Error:', err);
      }
    }

    async function fetchKmbEta(route) {
      try {
        const stopId = route.stopId;
        const routeNo = route.routeNo;
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
        const data = await res.json();

        if (data && data.data) {
          const now = new Date();
          const filtered = data.data
            .filter(item => item.route === routeNo && item.eta && (!route.boundDir || item.dir === route.boundDir))
            .map(item => Math.round((new Date(item.eta) - now) / 60000))
            .filter(m => m >= 0)
            .sort((a, b) => a - b);

          if (filtered.length > 0) {
            updateCardEtaUI(route.id, filtered[0] === 0 ? '即將' : filtered[0], filtered[1] !== undefined ? filtered[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function fetchCtbEta(route) {
      try {
        const stopId = route.stopId;
        const routeNo = route.routeNo;
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${stopId}/${routeNo}`);
        const data = await res.json();

        if (data && data.data) {
          const now = new Date();
          const targetDir = route.boundDir || 'O';
          const filtered = data.data
            .filter(item => item.eta && (item.dir === targetDir || !item.dir))
            .map(item => Math.round((new Date(item.eta) - now) / 60000))
            .filter(m => m >= 0)
            .sort((a, b) => a - b);

          if (filtered.length > 0) {
            updateCardEtaUI(route.id, filtered[0] === 0 ? '即將' : filtered[0], filtered[1] !== undefined ? filtered[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function fetchMtrBusEta(route) {
      try {
        const routeNo = route.routeNo;
        const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: 'zh', routeName: routeNo })
        });
        const data = await res.json();

        if (data && data.busStop && Array.isArray(data.busStop)) {
          let minsList = [];
          // 精確尋找指定站點 ID，若找不到則嘗試站名匹配或降級回第一個站點
          const targetStop = data.busStop.find(s => s.busStopId === route.stopId) || 
                             data.busStop.find(s => (s.busStopName || s.busStopRemark || '').includes(route.origin)) || 
                             data.busStop[0];

          if (targetStop && targetStop.bus && Array.isArray(targetStop.bus)) {
            targetStop.bus.forEach(b => {
              const secStr = b.departureTimeInSecond !== undefined ? b.departureTimeInSecond : b.arrivalTimeInSecond;
              if (secStr !== undefined && secStr !== null) {
                const sec = parseInt(secStr);
                if (!isNaN(sec)) {
                  const m = Math.max(0, Math.round(sec / 60));
                  minsList.push(m);
                }
              }
            });
          }
          minsList.sort((a, b) => a - b);

          if (minsList.length > 0) {
            updateCardEtaUI(route.id, minsList[0] === 0 ? '即將' : minsList[0], minsList[1] !== undefined ? minsList[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    async function fetchMtrEta(route) {
      try {
        const line = route.line || 'TML';
        const sta = route.sta || 'YUL';
        const dir = route.dir || 'DOWN';

        const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);
        const data = await res.json();

        if (data.status === 1 && data.data && data.data[`${line}-${sta}`]) {
          const scheduleData = data.data[`${line}-${sta}`][dir] || [];
          const minsList = scheduleData.map(item => parseInt(item.ttnt)).filter(n => !isNaN(n));

          if (minsList.length > 0) {
            updateCardEtaUI(route.id, minsList[0] === 0 ? '即將' : minsList[0], minsList[1] !== undefined ? minsList[1] : '');
          } else {
            updateCardEtaUI(route.id, '暫無班次', '');
          }
        } else {
          updateCardEtaUI(route.id, '暫無班次', '');
        }
      } catch (err) {
        updateCardEtaUI(route.id, '暫無班次', '');
      }
    }

    function updateCardEtaUI(cardId, primaryText, secondaryText) {
      const primaryEl = document.getElementById(`eta-primary-${cardId}`);

    function filterBusRoutes() {
      const keyword = document.getElementById('routeSearchInput').value.trim().toUpperCase();
      const dropdown = document.getElementById('routeSelectDropdown');
      dropdown.innerHTML = '';

      if (!keyword) {
        dropdown.innerHTML = '<option value="">-- 請輸入路線號碼 --</option>';
        return;
      }

      if (selectedOperator === 'KMB') {
        const matches = fetchedBusRoutes.filter(r => (r.route || '').toUpperCase().startsWith(keyword));
        if (matches.length === 0) {
          dropdown.innerHTML = `<option value="">未找到匹配 ${keyword} 的九巴路線</option>`;
          return;
        }

        dropdown.innerHTML = '<option value="">-- 請選擇路線及方向 --</option>';
        matches.slice(0, 40).forEach(r => {
          const opt = document.createElement('option');
          opt.value = JSON.stringify({
            route: r.route,
            boundDir: r.bound,
            dirApi: r.bound === 'I' ? 'inbound' : 'outbound',
            serviceType: r.service_type || '1',
            orig_tc: r.orig_tc,
            dest_tc: r.dest_tc
          });
          opt.textContent = `${r.route}: ${r.orig_tc} 往 ${r.dest_tc}`;
          dropdown.appendChild(opt);
        });
      } else if (selectedOperator === 'CTB') {
        const matches = fetchedBusRoutes.filter(r => (r.route || '').toUpperCase().startsWith(keyword));
        if (matches.length === 0) {
          dropdown.innerHTML = `<option value="">未找到匹配 ${keyword} 的城巴路線</option>`;
          return;
        }

        dropdown.innerHTML = '<option value="">-- 請選擇路線及方向 --</option>';
        matches.slice(0, 30).forEach(r => {
          const optOut = document.createElement('option');
          optOut.value = JSON.stringify({
            route: r.route,
            boundDir: 'O',
            dirApi: 'outbound',
            orig_tc: r.orig_tc,
            dest_tc: r.dest_tc
          });
          optOut.textContent = `${r.route}: ${r.orig_tc} 往 ${r.dest_tc}`;
          dropdown.appendChild(optOut);

          const optIn = document.createElement('option');
          optIn.value = JSON.stringify({
            route: r.route,
            boundDir: 'I',
            dirApi: 'inbound',
            orig_tc: r.dest_tc,
            dest_tc: r.orig_tc
          });
          optIn.textContent = `${r.route}: ${r.dest_tc} 往 ${r.orig_tc}`;
          dropdown.appendChild(optIn);
        });
      } else if (selectedOperator === 'MTRBUS') {
        const matches = fetchedBusRoutes.filter(r => (r.route || '').toUpperCase().includes(keyword));
        if (matches.length === 0) {
          dropdown.innerHTML = `<option value="">未找到匹配 ${keyword} 的港鐵巴士路線</option>`;
          return;
        }

        dropdown.innerHTML = '<option value="">-- 請選擇路線及方向 --</option>';
        matches.forEach(r => {
          const optOut = document.createElement('option');
          optOut.value = JSON.stringify({
            route: r.route,
            boundDir: 'O',
            orig_tc: r.orig_tc,
            dest_tc: r.dest_tc
          });
          optOut.textContent = `${r.route}: ${r.orig_tc} 往 ${r.dest_tc}`;
          dropdown.appendChild(optOut);

          const optIn = document.createElement('option');
          optIn.value = JSON.stringify({
            route: r.route,
            boundDir: 'I',
            orig_tc: r.dest_tc,
            dest_tc: r.orig_tc
          });
          optIn.textContent = `${r.route}: ${r.dest_tc} 往 ${r.orig_tc}`;
          dropdown.appendChild(optIn);
        });
      }
    }

    async function onRouteSelected() {
      const val = document.getElementById('routeSelectDropdown').value;
      const stopDropdown = document.getElementById('stopSelectDropdown');
      stopDropdown.innerHTML = '<option value="">載入站點中...</option>';

      if (!val) return;

      const routeObj = JSON.parse(val);

      try {
        if (selectedOperator === 'KMB') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${routeObj.route}/${routeObj.dirApi}/${routeObj.serviceType}`);
          const stopData = await res.json();
          
          stopDropdown.innerHTML = '<option value="">-- 請選擇上車站點 --</option>';
          for (const s of (stopData.data || [])) {
            const stopInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`);
            const stopInfo = await stopInfoRes.json();
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ stopId: s.stop, stopName: stopInfo.data.name_tc });
            opt.textContent = `${s.seq}. ${stopInfo.data.name_tc}`;
            stopDropdown.appendChild(opt);
          }
        } else if (selectedOperator === 'CTB') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${routeObj.route}/${routeObj.dirApi}`);
          const stopData = await res.json();

          stopDropdown.innerHTML = '<option value="">-- 請選擇上車站點 --</option>';
          for (const s of (stopData.data || [])) {
            const stopInfoRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`);
            const stopInfo = await stopInfoRes.json();
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ stopId: s.stop, stopName: stopInfo.data.name_tc });
            opt.textContent = `${s.seq}. ${stopInfo.data.name_tc}`;
            stopDropdown.appendChild(opt);
          }
        } else if (selectedOperator === 'MTRBUS') {
          stopDropdown.innerHTML = '<option value="">載入港鐵巴士實時站點中...</option>';
          const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ language: 'zh', routeName: routeObj.route })
          });
          const busData = await res.json();

          if (busData && busData.busStop && Array.isArray(busData.busStop)) {
            stopDropdown.innerHTML = '<option value="">-- 請選擇上車站點 --</option>';
            busData.busStop.forEach((st, idx) => {
              const name = getMtrBusStopDisplayName(st, idx, routeObj);
              const opt = document.createElement('option');

          }
        }
      } catch (e) {
        stopDropdown.innerHTML = '<option value="">載入站點失敗</option>';
      }

          badgeText: '港鐵 MTR',
          routeNo: lineObj.name.split(' ')[0],
          origin: staName + '站',
          dest: dir === 'DOWN' ? '下行/往終點方向' : '上行/往終點方向',
          line: lineObj.code,
          sta: staCode,
          dir: dir
        };

        appConfig.routes.push(newRoute);
      }

      renderModalRouteList();
    }

    function renderModalRouteList() {
      const container = document.getElementById('modalRouteList');
      container.innerHTML = '';

      (appConfig.routes || []).forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-900 px-3 py-2 rounded text-xs border border-slate-700';
        item.innerHTML = `
          <div class="truncate mr-2">
            <span class="font-bold text-amber-400">[${r.badgeText || r.type}] ${r.routeNo}</span>
            <span class="text-slate-300 ml-1 sm:ml-2 truncate">${r.origin} 往 ${r.dest}</span>
          </div>
          <button onclick="removeRouteAt(${idx})" class="text-rose-400 hover:text-rose-300 font-bold p-1 shrink-0">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        container.appendChild(item);
      });
    }

    function removeRouteAt(idx) {
      appConfig.routes.splice(idx, 1);
      renderModalRouteList();
    }

    function addDefaultPresets() {
      appConfig.routes = JSON.parse(JSON.stringify(DEFAULT_CONFIG.routes));
      renderModalRouteList();
    }

    function saveSettings() {
      const mode = document.getElementById('selectCountdownMode').value;
      appConfig.countdownMode = mode;

      if (mode === 'SELECT_HK') {
        const selectedVal = document.getElementById('selectHkHolidayDropdown').value;
        if (selectedVal) {
          const parsed = JSON.parse(selectedVal);
          appConfig.countdownTitle = parsed.title;
          appConfig.countdownDate = parsed.date;
        }
      } else if (mode === 'CUSTOM') {
        appConfig.countdownTitle = document.getElementById('inputCountdownTitle').value;
        appConfig.countdownDate = document.getElementById('inputCountdownDate').value;
      }

      appConfig.weatherStation = document.getElementById('selectWeatherStation').value;

      localStorage.setItem('hk_dashboard_config_v5', JSON.stringify(appConfig));

      closeModal('customModal');
      fetchWeatherData();
      renderRouteCards();
      fetchEtaData();
      updateCountdown();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => {
          console.log(e);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
